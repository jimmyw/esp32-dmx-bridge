<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121214">
<title>DMX Console</title>
</head>
<body>
<header>
  <h1>DMX Console</h1>
  <span class="dot" id="conn" title="connection"></span>
  <button id="prev" aria-label="previous bank">◀</button>
  <span id="bank">Ch 1–16</span>
  <button id="next" aria-label="next bank">▶</button>
  <input id="jump" type="number" min="1" max="512" placeholder="Ch #" aria-label="jump to channel">
  <span class="sp"></span>
  <button id="hidBtn" hidden title="show hidden channels so you can unhide them"></button>
  <button id="units" title="toggle value display">DMX</button>
  <button id="clear" title="set all console faders to 0">Clear</button>
  <button id="fsBtn" hidden title="fullscreen (F)" aria-label="toggle fullscreen">⛶ Full</button>
  <a class="btn" href="/">Settings</a>
</header>
<div id="scenebar">
  <span class="lbl">Scenes</span>
  <div id="scenes"></div>
  <label class="lbl" for="fade">Fade s</label>
  <input id="fade" type="number" min="0" max="60" step="0.1" value="0" title="fade time for recall (seconds)">
  <button id="updBtn" hidden title="overwrite the active scene with the current faders">Update</button>
  <button id="delBtn" class="danger" hidden title="delete the active scene">Delete</button>
  <button id="editBtn" title="save, rename or delete scenes">Edit</button>
</div>
<div id="editor" hidden>
  <span class="t" id="edTitle"></span>
  <input id="edName" maxlength="24" placeholder="Scene name">
  <button id="edSave">Save faders</button>
  <button id="edRename">Rename</button>
  <button id="edDelete" class="danger">Delete</button>
  <button id="edCancel">Cancel</button>
  <span id="msg"></span>
</div>
<div id="chback" hidden></div>
<div id="chmenu" hidden role="dialog" aria-label="channel settings">
  <span class="t" id="cmTitle"></span>
  <input id="cmName" maxlength="24" placeholder="Name">
  <button id="cmHide"></button>
  <div class="row"><button id="cmSave">Save</button><button id="cmCancel">Cancel</button></div>
</div>
<div id="desk">
  <div id="strips"></div>
  <div class="strip master" id="masterStrip"></div>
</div>

</body>
</html>
