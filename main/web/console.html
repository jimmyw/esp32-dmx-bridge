<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121214">
<title>DMX Console</title>
<style>
:root{--bg:#121214;--panel:#1b1b1f;--strip:#202026;--line:#2e2e36;--fg:#ececf0;--mut:#8a8a96;
  --cap:#d9d9e0;--acc:#f0a63a;--meter:#4fb3ff;--ok:#3cc47a;--bad:#e06464}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 6px 0 0;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);display:inline-block}
.dot.on{background:var(--ok)}
button,.btn{background:var(--strip);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 11px;
  font:inherit;cursor:pointer;text-decoration:none;touch-action:manipulation}
button:active{background:var(--line)}
#bank{font-variant-numeric:tabular-nums;min-width:92px;text-align:center}
.sp{flex:1}
#desk{flex:1;display:flex;gap:6px;padding:10px 12px;min-height:0}
#strips{flex:1;display:grid;gap:6px;min-width:0}
.strip{background:var(--strip);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;
  align-items:center;padding:6px 3px;min-width:0;min-height:0}
.strip.master{flex:0 0 76px;border-color:#4a3a20}
.val{font-variant-numeric:tabular-nums;font-size:13px;height:18px;color:var(--acc)}
.track{flex:1;width:100%;position:relative;touch-action:none;cursor:ns-resize;margin:6px 0;min-height:80px}
.slot{position:absolute;left:50%;top:10px;bottom:10px;width:6px;margin-left:-3px;background:#0b0b0d;border-radius:3px}
.meter{position:absolute;left:calc(50% + 9px);bottom:10px;width:4px;background:var(--meter);border-radius:2px;opacity:.85}
.fill{position:absolute;left:50%;bottom:10px;width:6px;margin-left:-3px;background:var(--acc);border-radius:3px;opacity:.5}
.cap{position:absolute;left:50%;width:min(44px,90%);height:20px;margin:-10px 0 0 calc(min(44px,90%) / -2);
  background:linear-gradient(#f4f4f8,#b9b9c2);border-radius:4px;box-shadow:0 2px 4px #0008;pointer-events:none}
.cap::after{content:"";position:absolute;left:4px;right:4px;top:9px;height:2px;background:#333}
.master .cap{background:linear-gradient(#ffd38a,#d08a20)}
.ch{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.nm{width:100%;height:30px;font-size:11px;line-height:13px;text-align:center;overflow:hidden;cursor:text;
  border-radius:4px;background:#0f0f12;border:1px solid var(--line);padding:1px 2px;margin-bottom:5px;
  display:flex;align-items:center;justify-content:center;word-break:break-word;color:var(--fg)}
.nm.empty{color:#55555f}
.nm input{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--acc);border-radius:3px;
  font:inherit;font-size:12px;padding:2px;text-align:center}
.master .nm{cursor:default;color:var(--acc);border-color:#4a3a20}
.btns{display:flex;flex-direction:column;gap:4px;width:100%;margin-top:6px}
.btns button{padding:6px 0;font-size:12px;width:100%}
.btns button.fl:active,.btns button.fl.down{background:var(--acc);color:#000}
#jump{width:70px;background:var(--strip);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px;font:inherit}
#scenebar{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#scenebar .lbl{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
#scenes{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:thin;padding:2px 0}
#scenes button{flex:0 0 auto;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#scenes button.active{border-color:var(--acc);color:var(--acc)}
#scenes button.fading{animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{from{background:var(--strip)}to{background:#4a3a20}}
#scenes button.new{color:var(--mut);border-style:dashed}
#scenes .empty{color:var(--mut)}
#fade{width:58px;background:var(--strip);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px;font:inherit}
#fsBtn.on{background:var(--acc);color:#000}
#editBtn.on{background:var(--acc);color:#000}
#editor{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 12px;background:#1a1610;border-bottom:1px solid #4a3a20}
#editor input{flex:1;min-width:140px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px;font:inherit}
#editor .t{color:var(--acc);font-size:13px}
#scenebar button.danger{border-color:var(--bad);color:var(--bad)}
#editor button.danger{border-color:var(--bad);color:var(--bad)}
#msg{color:var(--mut);font-size:12px}
@media (max-width:560px){header h1{display:none}.strip.master{flex-basis:60px}}
</style>
</head>
<body>
<header>
  <h1>DMX Console</h1>
  <span class="dot" id="conn" title="connection"></span>
  <button id="prev" aria-label="previous bank">◀</button>
  <span id="bank">Ch 1–16</span>
  <button id="next" aria-label="next bank">▶</button>
  <input id="jump" type="number" min="1" max="512" placeholder="Ch #" aria-label="jump to channel">
  <span class="sp"></span>
  <button id="units" title="toggle value display">DMX</button>
  <button id="clear" title="set all console faders to 0">Clear</button>
  <button id="fsBtn" hidden title="fullscreen (F)" aria-label="toggle fullscreen">⛶ Full</button>
  <a class="btn" href="/">Settings</a>
</header>
<div id="scenebar">
  <span class="lbl">Scenes</span>
  <div id="scenes"></div>
  <label class="lbl" for="fade">Fade s</label>
  <input id="fade" type="number" min="0" max="60" step="0.1" value="0" title="fade time for recall (seconds)">
  <button id="updBtn" hidden title="overwrite the active scene with the current faders">Update</button>
  <button id="delBtn" class="danger" hidden title="delete the active scene">Delete</button>
  <button id="editBtn" title="save, rename or delete scenes">Edit</button>
</div>
<div id="editor" hidden>
  <span class="t" id="edTitle"></span>
  <input id="edName" maxlength="24" placeholder="Scene name">
  <button id="edSave">Save faders</button>
  <button id="edRename">Rename</button>
  <button id="edDelete" class="danger">Delete</button>
  <button id="edCancel">Cancel</button>
  <span id="msg"></span>
</div>
<div id="desk">
  <div id="strips"></div>
  <div class="strip master" id="masterStrip"></div>
</div>

<script>
const N = 512;
const manual = new Uint8Array(N), output = new Uint8Array(N);
let master = 255, bankSize = 16, bankStart = 0, ws = null, pct = false;
const touched = new Map();          // ch -> timestamp of last local change (ignore echoes briefly)
const pending = new Map();          // ch -> value to send
const MASTER = 0xFFFF;
const strips = [];                  // visible strip objects

try { pct = localStorage.getItem('pct') === '1'; bankStart = +localStorage.getItem('bank') || 0; } catch (e) {}

const fmt = v => pct ? Math.round(v / 2.55) + '%' : String(v);

function makeStrip(parent, isMaster) {
  const el = document.createElement('div');
  if (!isMaster) el.className = 'strip';
  el.innerHTML = `<div class="nm"></div><div class="val"></div>
    <div class="track"><div class="slot"></div><div class="fill"></div><div class="meter"></div><div class="cap"></div></div>
    <div class="ch"></div>
    <div class="btns"><button class="fl">${isMaster ? 'DBO' : 'Flash'}</button><button class="zero">${isMaster ? 'Full' : '0'}</button></div>`;
  if (isMaster) { parent.append(...el.childNodes); } else { parent.appendChild(el); }
  const root = isMaster ? parent : el;
  const s = {
    root, ch: -1, value: 0, flash: false, dragging: false,
    val: root.querySelector('.val'), track: root.querySelector('.track'), cap: root.querySelector('.cap'),
    fill: root.querySelector('.fill'), meter: root.querySelector('.meter'), label: root.querySelector('.ch'),
    fl: root.querySelector('.fl'), zero: root.querySelector('.zero'), isMaster,
    nm: root.querySelector('.nm'),
  };
  bindFader(s);
  if (!isMaster) s.nm.addEventListener('click', () => editName(s));
  return s;
}

function geom(s) {
  const r = s.track.getBoundingClientRect();
  return { top: r.top + 10, h: Math.max(1, r.height - 20) };
}

function setLocal(s, v) {
  v = Math.max(0, Math.min(255, Math.round(v)));
  const ch = s.isMaster ? MASTER : s.ch;
  if (s.isMaster) master = v; else manual[s.ch] = v;
  touched.set(ch, performance.now());
  pending.set(ch, v);
  render(s);
  scheduleSend();
}

function bindFader(s) {
  let offset = 0;
  const fromY = y => { const g = geom(s); return (1 - (y - offset - g.top) / g.h) * 255; };
  s.track.addEventListener('pointerdown', e => {
    s.track.setPointerCapture(e.pointerId);
    s.dragging = true;
    const g = geom(s), capY = g.top + (1 - cur(s) / 255) * g.h;
    offset = Math.abs(e.clientY - capY) < 16 ? e.clientY - capY : 0;   // grab cap = relative, else jump
    setLocal(s, fromY(e.clientY));
  });
  s.track.addEventListener('pointermove', e => { if (s.dragging) setLocal(s, fromY(e.clientY)); });
  const end = () => { s.dragging = false; };
  s.track.addEventListener('pointerup', end);
  s.track.addEventListener('pointercancel', end);
  s.track.addEventListener('wheel', e => {
    e.preventDefault();
    setLocal(s, cur(s) + (e.deltaY < 0 ? 1 : -1) * (e.shiftKey ? 10 : 1));
  }, { passive: false });

  // Flash (strip) / DBO (master): momentary
  const down = e => {
    e.preventDefault(); s.fl.classList.add('down');
    if (s.isMaster) { s.saved = master; setLocal(s, 0); }
    else { s.saved = manual[s.ch]; setLocal(s, 255); }
  };
  const up = () => {
    if (!s.fl.classList.contains('down')) return;
    s.fl.classList.remove('down'); setLocal(s, s.saved);
  };
  s.fl.addEventListener('pointerdown', down);
  s.fl.addEventListener('pointerup', up);
  s.fl.addEventListener('pointerleave', up);
  s.fl.addEventListener('pointercancel', up);
  s.zero.addEventListener('click', () => setLocal(s, s.isMaster ? 255 : 0));
}

const cur = s => s.isMaster ? master : manual[s.ch];

function render(s) {
  const v = cur(s);
  s.val.textContent = fmt(v);
  const g = s.track.clientHeight - 20;
  s.cap.style.top = (10 + (1 - v / 255) * g) + 'px';
  s.fill.style.height = (v / 255 * g) + 'px';
  if (!s.isMaster) s.meter.style.height = (output[s.ch] / 255 * g) + 'px';
}

const masterStrip = makeStrip(document.getElementById('masterStrip'), true);
masterStrip.label.textContent = 'Master';
masterStrip.nm.textContent = 'MASTER';
masterStrip.meter.style.display = 'none';

function layout() {
  const w = window.innerWidth;
  const size = w >= 1100 ? 16 : w >= 700 ? 12 : 8;
  if (size !== bankSize || strips.length === 0) {
    bankSize = size;
    const box = document.getElementById('strips');
    box.innerHTML = ''; strips.length = 0;
    box.style.gridTemplateColumns = `repeat(${size}, minmax(0,1fr))`;
    for (let i = 0; i < size; i++) strips.push(makeStrip(box, false));
  }
  bankStart = Math.min(Math.floor(bankStart / bankSize) * bankSize, N - bankSize);
  strips.forEach((s, i) => { s.ch = bankStart + i; s.label.textContent = s.ch + 1; renderName(s); });
  document.getElementById('bank').textContent = `Ch ${bankStart + 1}–${bankStart + bankSize}`;
  try { localStorage.setItem('bank', bankStart); } catch (e) {}
  renderAll();
}

function renderAll() { strips.forEach(render); render(masterStrip); }

function go(delta) { bankStart = Math.max(0, Math.min(N - bankSize, bankStart + delta * bankSize)); layout(); }
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('jump').addEventListener('change', e => {
  const c = Math.max(1, Math.min(N, +e.target.value || 1)) - 1;
  bankStart = Math.floor(c / bankSize) * bankSize; e.target.value = ''; layout();
});
document.getElementById('units').onclick = e => {
  pct = !pct; e.target.textContent = pct ? '%' : 'DMX';
  try { localStorage.setItem('pct', pct ? '1' : '0'); } catch (err) {}
  renderAll();
};
document.getElementById('units').textContent = pct ? '%' : 'DMX';

let clearArmed = 0;
document.getElementById('clear').onclick = e => {
  if (performance.now() - clearArmed > 2500) { clearArmed = performance.now(); e.target.textContent = 'Sure?';
    setTimeout(() => e.target.textContent = 'Clear', 2500); return; }
  clearArmed = 0; e.target.textContent = 'Clear';
  manual.fill(0); touched.clear(); pending.clear();
  for (let i = 0; i < N; i++) touched.set(i, performance.now());
  if (ws && ws.readyState === 1) ws.send('clear');
  renderAll();
};

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key >= '1' && e.key <= '9' && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const sc = scenes[+e.key - 1]; if (sc && !editMode) recall(sc.id);
  }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(-1);
  if (e.key === 'ArrowRight' || e.key === 'PageDown') go(1);
});

// ---- channel names (stored on the bridge, shared by all clients) ----
const names = {};   // 0-based channel -> name
let nameMax = 24;

function renderName(s) {
  if (s.editing) return;
  const n = names[s.ch] || '';
  s.nm.textContent = n || 'name';
  s.nm.classList.toggle('empty', !n);
  s.root.title = n ? `Ch ${s.ch + 1}: ${n}` : `Ch ${s.ch + 1}`;
}

async function fetchNames() {
  try {
    const r = await (await fetch('/api/names')).json();
    nameMax = r.max_len || nameMax;
    for (const k in names) delete names[k];
    for (const [ch, n] of Object.entries(r.names)) names[+ch - 1] = n;
    strips.forEach(renderName);
  } catch (e) {}
}

function editName(s) {
  if (s.editing) return;
  s.editing = true;
  const ch = s.ch, inp = document.createElement('input');
  inp.value = names[ch] || ''; inp.maxLength = nameMax; inp.placeholder = `Ch ${ch + 1}`;
  inp.setAttribute('aria-label', `name for channel ${ch + 1}`);
  s.nm.textContent = ''; s.nm.classList.remove('empty'); s.nm.appendChild(inp);
  inp.focus(); inp.select();
  let done = false;
  const finish = async save => {
    if (done) return; done = true; s.editing = false;
    const v = inp.value.trim();
    if (save && v !== (names[ch] || '')) {
      if (v) names[ch] = v; else delete names[ch];
      try {
        await fetch('/api/names', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                   body: JSON.stringify({[ch + 1]: v})});
      } catch (e) {}
    }
    if (s.ch === ch) renderName(s);
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') finish(false);
    else if (e.key === 'Tab') {               // Tab = save and edit the next strip
      e.preventDefault(); finish(true);
      const i = strips.indexOf(s) + (e.shiftKey ? -1 : 1);
      if (strips[i]) setTimeout(() => editName(strips[i]), 0);
    }
  });
  inp.addEventListener('blur', () => finish(true));
}

// ---- scenes (stored on the bridge) ----
let scenes = [], sceneCount = 64, activeScene = 0, fading = false, editMode = false, editId = 0, delArmed = false;
let barDelArmed = 0, barTimer = 0;
const $ = id => document.getElementById(id);
try { $('fade').value = localStorage.getItem('fade') || '0'; } catch (e) {}
$('fade').addEventListener('change', () => { try { localStorage.setItem('fade', $('fade').value); } catch (e) {} });

async function fetchScenes() {
  try {
    const r = await (await fetch('/api/scenes')).json();
    scenes = r.scenes; sceneCount = r.count; activeScene = r.active; fading = r.fading;
    renderScenes();
  } catch (e) {}
}

function renderSceneActions() {
  const sc = !editMode && scenes.find(x => x.id === activeScene);
  $('updBtn').hidden = $('delBtn').hidden = !sc;
  if (!sc) { barDelArmed = 0; return; }
  if (barDelArmed !== sc.id) barDelArmed = 0;
  $('updBtn').title = `overwrite "${sc.name}" with the current faders`;
  $('delBtn').title = `delete "${sc.name}"`;
  $('delBtn').textContent = barDelArmed ? 'Tap again to delete' : 'Delete';
}
function flashBtn(b, text) {
  const old = b.dataset.label || (b.dataset.label = b.textContent);
  b.textContent = text; clearTimeout(barTimer);
  barTimer = setTimeout(() => { b.textContent = old; }, 1500);
}

function renderScenes() {
  renderSceneActions();
  const box = $('scenes');
  box.innerHTML = '';
  const add = (label, cls, fn, title) => {
    const b = document.createElement('button');
    b.textContent = label; if (cls) b.className = cls; if (title) b.title = title;
    b.onclick = fn; box.appendChild(b); return b;
  };
  if (editMode) {
    const used = new Map(scenes.map(sc => [sc.id, sc.name]));
    for (let id = 1; id <= sceneCount; id++) {
      const n = used.get(id);
      add(n ? `${id}. ${n}` : `${id}. –`, (n ? '' : 'empty') + (id === editId ? ' active' : ''), () => openEditor(id));
    }
    return;
  }
  scenes.forEach((sc, i) => {
    const cls = (sc.id === activeScene ? 'active' : '') + (sc.id === activeScene && fading ? ' fading' : '');
    const b = add(sc.name, cls, () => recall(sc.id),
                  `Scene ${sc.id}` + (i < 9 ? ` (key ${i + 1})` : '') + ' – right-click / long-press to edit');
    b.oncontextmenu = e => {                      // right-click or long-press: edit this scene
      e.preventDefault(); editMode = true; $('editBtn').classList.add('on'); openEditor(sc.id);
    };
  });
  add('+ Save', 'new', () => {
    const used = new Set(scenes.map(sc => sc.id));
    let id = 1; while (used.has(id) && id <= sceneCount) id++;
    if (id > sceneCount) { editMode = true; $('editBtn').classList.add('on'); renderScenes(); return; }
    openEditor(id);
  }, 'save the current console faders as a new scene');
  if (!scenes.length) {
    const t = document.createElement('span'); t.className = 'empty';
    t.textContent = 'Set faders, then + Save'; box.appendChild(t);
  }
}

async function sceneApi(body) {
  try {
    const r = await (await fetch('/api/scenes', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                                 body: JSON.stringify(body)})).json();
    if (!r.ok) $('msg').textContent = r.error || 'failed';
    return r.ok;
  } catch (e) { $('msg').textContent = 'connection failed'; return false; }
}

function recall(id) {
  const fade = Math.max(0, Math.min(60, parseFloat($('fade').value) || 0));
  activeScene = id; fading = fade > 0; renderScenes();
  sceneApi({action: 'recall', id, fade_ms: Math.round(fade * 1000)});
}

function openEditor(id) {
  editId = id; delArmed = false;
  const sc = scenes.find(x => x.id === id);
  $('editor').hidden = false;
  $('edTitle').textContent = sc ? `Scene ${id}` : `New scene ${id}`;
  $('edName').value = sc ? sc.name : '';
  $('edName').placeholder = `Scene ${id}`;
  $('edRename').hidden = $('edDelete').hidden = !sc;
  $('edSave').textContent = sc ? 'Overwrite with faders' : 'Save faders';
  $('edDelete').textContent = 'Delete';
  $('msg').textContent = '';
  $('edName').focus();
  renderScenes();
}
function closeEditor() { $('editor').hidden = true; editId = 0; renderScenes(); }

$('edSave').onclick = async () => {
  if (await sceneApi({action: 'save', id: editId, name: $('edName').value.trim()})) closeEditor();
};
$('edRename').onclick = async () => {
  if (await sceneApi({action: 'rename', id: editId, name: $('edName').value.trim()})) closeEditor();
};
$('edDelete').onclick = async () => {
  if (!delArmed) { delArmed = true; $('edDelete').textContent = 'Tap again to delete'; return; }
  if (await sceneApi({action: 'delete', id: editId})) closeEditor();
};
$('edCancel').onclick = closeEditor;
$('updBtn').onclick = async () => {
  const id = activeScene;
  if (await sceneApi({action: 'save', id, name: ''})) flashBtn($('updBtn'), 'Saved ✓');
  else flashBtn($('updBtn'), $('msg').textContent || 'failed');
};
$('delBtn').onclick = async () => {
  const id = activeScene;
  if (barDelArmed !== id) { barDelArmed = id; renderSceneActions(); return; }
  barDelArmed = 0;
  if (await sceneApi({action: 'delete', id})) { activeScene = 0; fetchScenes(); }
  else { renderSceneActions(); flashBtn($('delBtn'), $('msg').textContent || 'failed'); }
};
$('edName').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('edSave').click();
  if (e.key === 'Escape') closeEditor();
});
$('editBtn').onclick = () => {
  editMode = !editMode; $('editBtn').classList.toggle('on', editMode);
  if (!editMode) closeEditor(); else renderScenes();
};

// ---- fullscreen ----
{
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  const cur = () => document.fullscreenElement || document.webkitFullscreenElement;
  const exit = () => (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  const fsBtn = $('fsBtn');
  const sync = () => {
    const on = !!cur();
    fsBtn.textContent = on ? '⛶ Exit' : '⛶ Full';
    fsBtn.classList.toggle('on', on);
  };
  const toggle = () => {
    try {
      const p = cur() ? exit() : req.call(el, {navigationUI: 'hide'});
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  };
  if (req) {                                    // iPhone Safari has no fullscreen API: keep it hidden
    fsBtn.hidden = false;
    fsBtn.onclick = toggle;
    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);
    document.addEventListener('keydown', e => {
      if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey &&
          !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) toggle();
    });
  }
}

// ---- network ----
let sendTimer = null, lastSend = 0;
function scheduleSend() {
  if (sendTimer) return;
  const wait = Math.max(0, 25 - (performance.now() - lastSend));
  sendTimer = setTimeout(flush, wait);
}
function flush() {
  sendTimer = null;
  if (!ws || ws.readyState !== 1 || pending.size === 0) return;
  const buf = new Uint8Array(pending.size * 3);
  let i = 0;
  for (const [ch, v] of pending) { buf[i++] = ch >> 8; buf[i++] = ch & 255; buf[i++] = v; }
  pending.clear();
  ws.send(buf);
  lastSend = performance.now();
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { document.getElementById('conn').className = 'dot on'; flush(); fetchNames(); fetchScenes(); };
  ws.onclose = () => { document.getElementById('conn').className = 'dot'; setTimeout(connect, 1500); };
  ws.onerror = () => ws.close();
  ws.onmessage = ev => {
    if (typeof ev.data === 'string') {
      if (ev.data === 'names') fetchNames();
      if (ev.data === 'scenes') fetchScenes();
      return;
    }
    const d = new Uint8Array(ev.data);
    if (d[0] !== 1 || d.length < 2 + 2 * N) return;
    const now = performance.now(), fresh = ch => now - (touched.get(ch) || 0) < 400;
    if (!masterStrip.dragging && !fresh(MASTER) && !masterStrip.fl.classList.contains('down')) master = d[1];
    for (let i = 0; i < N; i++) {
      if (!fresh(i)) manual[i] = d[2 + i];
      output[i] = d[2 + N + i];
    }
    renderAll();
  };
}

window.addEventListener('resize', layout);
layout();
connect();
</script>
